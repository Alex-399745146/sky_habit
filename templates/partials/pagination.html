{% if is_paginated %}
  <nav class="mt-4" aria-label="Пагинация">
    <ul class="pagination justify-content-center">
      {% if page_obj.has_previous %}
        <li class="page-item">
          <a class="page-link" href="?page={{ page_obj.previous_page_number }}" aria-label="Предыдущая страница">&larr;</a>
        </li>
      {% else %}
        <li class="page-item disabled"><span class="page-link">&larr;</span></li>
      {% endif %}

      <li class="page-item active" aria-current="page">
        <span class="page-link">{{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span>
      </li>

      {% if page_obj.has_next %}
        <li class="page-item">
          <a class="page-link" href="?page={{ page_obj.next_page_number }}" aria-label="Следующая страница">&rarr;</a>
        </li>
      {% else %}
        <li class="page-item disabled"><span class="page-link">&rarr;</span></li>
      {% endif %}
    </ul>
  </nav>
{% endif %}
