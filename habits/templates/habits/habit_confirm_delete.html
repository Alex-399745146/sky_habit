{% extends "base.html" %}

{% block title %}Удалить привычку — Sky Habit{% endblock %}

{% block content %}
  <div class="auth-card" style="max-width: 620px;">
    <div class="section-title mb-2">delete habit</div>
    <h1 class="h3 mb-4">Удалить привычку?</h1>

    <div class="matrix-card p-4 p-md-5">
      <p class="mb-1">Привычка будет удалена без возможности восстановления:</p>
      <p class="habit-action mb-3">«{{ object.action }}»</p>

      <form method="post">
        {% csrf_token %}
        <div class="d-flex flex-wrap gap-2">
          <button type="submit" class="btn btn-danger-matrix">Удалить</button>
          <a class="btn btn-outline-matrix" href="{% url 'habits_web:list' %}">Отмена</a>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
