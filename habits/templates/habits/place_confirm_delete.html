{% extends "base.html" %}

{% block title %}Удалить место — Sky Habit{% endblock %}

{% block content %}
  <div class="auth-card" style="max-width: 620px;">
    <div class="section-title mb-2">delete place</div>
    <h1 class="h3 mb-4">Удалить место?</h1>

    <div class="matrix-card p-4 p-md-5">
      <p class="mb-1">Место будет удалено:</p>
      <p class="habit-action mb-3">«{{ object.name }}»</p>
      <p class="meta">
        Привычки не удалятся — у них просто не останется привязки к месту.
      </p>

      <form method="post">
        {% csrf_token %}
        <div class="d-flex flex-wrap gap-2">
          <button type="submit" class="btn btn-danger-matrix">Удалить</button>
          <a class="btn btn-outline-matrix" href="{% url 'habits_web:place-list' %}">Отмена</a>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
